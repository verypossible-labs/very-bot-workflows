version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    # chore(deps) cuts a patch release, so action bumps reach callers on v1.
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
